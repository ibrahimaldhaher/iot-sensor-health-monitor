[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-monitor"
version = "1.0.0"
description = "Rule-based Normal/Abnormal monitoring of IoT motor readings (Lecture 1 exercise)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ibrahim Al-Dhaher" }]
keywords = ["iot", "machine-learning", "condition-monitoring", "edge-computing"]
dependencies = []

[project.optional-dependencies]
notebook = ["matplotlib>=3.7", "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "jupyter>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
iot-monitor = "iot_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["src/iot_monitor"]
